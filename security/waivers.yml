# Security waivers.
#
# Every suppression anywhere in this repo — a Bandit `# nosec`, a Semgrep
# `nosemgrep`, a Trivy `.trivyignore` entry, a pinned-but-vulnerable dependency —
# is registered here with a justification, a named owner, and an expiry date.
#
# scripts/check_waivers.py fails CI once an expiry passes. That is the point: a
# waiver is a decision made under particular circumstances, and it should have to
# be re-made when those circumstances may have changed.
#
# Required fields: id, reason, expires (YYYY-MM-DD), owner.
#
#   - id: BANDIT-B608-store-postgres
#     tool: bandit
#     reason: >-
#       Identifiers are interpolated because SQL has no parameter form for them;
#       both are validated against ^[a-z_][a-z0-9_]{0,62}$ at config load and
#       again at render time.
#     expires: 2027-01-01
#     owner: maintainers

waivers:
  - id: BANDIT-B104-api-bind
    tool: bandit
    rule: B104
    file: api/src/tns_mirror_api/__main__.py
    reason: >-
      The API server binds 0.0.0.0 by default because it runs in a container,
      where the network namespace is the isolation boundary and binding loopback
      would make the service unreachable from anywhere including its own
      published port. It is overridable with TNS_API_HOST for anyone running it
      outside a container. The service is read-only, rate-limited, and intended
      to sit behind an ingress; the shipped compose profile publishes it on
      127.0.0.1 rather than every interface.
    expires: 2027-01-31
    owner: maintainers
