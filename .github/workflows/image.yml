name: image

# Builds and scans the image on every change. Publishing lives in release.yml,
# which ships the image and the client together from one tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: server/Dockerfile
          failure-threshold: warning

  build-and-scan:
    name: build + scan
    runs-on: ubuntu-latest
    # An image never builds on a leaked credential.
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile
          push: false
          load: true
          tags: tns-mirror-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tns-mirror-server:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # A published image that cannot start is worse than no image.
      - name: Starts, and as non-root
        run: |
          set -euo pipefail
          docker run --rm tns-mirror-server:ci --version
          docker run --rm tns-mirror-server:ci --help > /dev/null
          test "$(docker run --rm --entrypoint id tns-mirror-server:ci -u)" = "10001"
          echo "image runs, and runs as non-root"

      # Everything else in CI tests the source. This drives the *artifact* with
      # the compose file we publish, against a real Postgres, following the
      # documented setup — which is where the 1.0.1 faults lived, invisible to
      # every source-level test.
      - name: End-to-end smoke test
        run: |
          docker tag tns-mirror-server:ci sarhatabaot/tns-mirror-server:smoke
          scripts/smoke_test.sh smoke
