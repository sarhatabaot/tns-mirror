# Publish a GitHub Release, ship both artifacts.
#
#   server  ->  Docker Hub   (sarhatabaot/tns-mirror-server)
#   client  ->  PyPI         (tns-mirror-client)
#
# Pages is deliberately *not* here. docs.yml already deploys the site from main,
# and releases are cut from main, so the published site is current the moment
# the tag exists. Deploying again from the tag would mean relaxing the
# github-pages environment — whose default rule, "the default branch only", is
# exactly the protection you want on the thing that serves your docs publicly.
#
# The server is *never* published to PyPI — it is a sync daemon, not a library,
# and its pyproject carries the "Private :: Do Not Upload" classifier so an
# accidental upload is refused by PyPI itself.
#
# To cut a release: tag the commit, then publish a Release from that tag on
# GitHub. Publishing the Release is what triggers this.
#
#   git tag 1.0.1 && git push origin 1.0.1
#   gh release create 1.0.1 --generate-notes
#
# Both artifacts carry one version, and **the major version is the schema
# version**: v1.x.y speaks schema v1. A consumer pinning
# 'tns-mirror-client>=1,<2' is therefore pinning the contract, which is the
# thing that actually matters to them.
#
# Nothing publishes until the full suite and the scanners pass: a release is the
# one moment a broken gate cannot be "fixed in the next commit".
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. 1.0.1"
        required: true
      dry_run:
        description: "Build and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  # A manual run publishes only when dry_run is explicitly false; a published
  # Release always publishes.
  PUBLISH: ${{ github.event_name == 'release' || inputs.dry_run == false }}
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v7

      # The tag must match what the code says it is, or the image and the wheel
      # get published under a version nothing in the repository claims.
      - name: Versions agree, and the tag matches
        run: python3 scripts/check_versions.py --tag "$TAG"

      - name: Server — lint and tests
        working-directory: server
        env:
          TNS_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          uv python install "$(cat .python-version)"
          uv sync --frozen --all-groups
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
          uv run pytest -m integration

      - name: Client — lint and tests
        working-directory: client
        env:
          TNS_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          uv sync --frozen --all-groups
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
          uv run pytest -m integration

      - name: Published contract is current
        run: uv run --project server python server/scripts/render_schema.py --check

      - name: No expired security waivers
        run: python3 scripts/check_waivers.py

  # --- server -> Docker Hub -------------------------------------------------
  server:
    name: server → Docker Hub
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # A multi-architecture build takes minutes; discovering the credentials
      # are missing at the login step wastes all of it and reports the problem
      # as "Username and password required", which does not say where to look.
      - name: Registry credentials are present
        if: env.PUBLISH == 'true'
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "$TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::missing secret(s):$missing"
            echo "Add them either as repository secrets (Settings -> Secrets" >&2
            echo "and variables -> Actions) or as secrets on the 'release'" >&2
            echo "environment. Both are visible here; an environment secret" >&2
            echo "just takes precedence over a repository one of the same name." >&2
            echo "DOCKERHUB_TOKEN is a Docker Hub access token with Read/Write," >&2
            echo "not an account password." >&2
            exit 1
          fi
          echo "registry credentials present"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_REPOSITORY || 'sarhatabaot/tns-mirror-server' }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- client -> PyPI -------------------------------------------------------
  client:
    name: client → PyPI
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      # Trusted publishing: PyPI verifies this workflow's identity directly, so
      # there is no long-lived API token to leak or rotate.
      id-token: write
      attestations: write
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        working-directory: client
        run: uv build

      # Catches a broken README or bad metadata before it is permanently on
      # PyPI — a version number cannot be reused once published.
      - name: Check package metadata
        working-directory: client
        run: uvx twine check --strict dist/*

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: client/dist/*

      # skip-existing makes a re-run safe. A release has three publish targets
      # and they can fail independently: if the image push fails after the wheel
      # is already on PyPI, re-running must complete the release rather than
      # erroring on a version that cannot be re-uploaded and cannot be deleted.
      - name: Publish
        if: env.PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: client/dist
          attestations: true
          skip-existing: true
