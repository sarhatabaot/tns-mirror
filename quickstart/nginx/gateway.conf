# tns-mirror gateway — keys, tiers and rate limits.
#
# This file is yours. It is mounted into the gateway container from your own
# compose stack and is never handed to whoever runs the outer proxy; that
# integration is quickstart/nginx/handoff.conf, six lines that never change.
#
# It runs inside the container as /etc/nginx/conf.d/default.conf. That path is
# included from within http{}, which is why the map and limit_req_zone
# directives below are legal here — they are http-level and could not live
# inside server{}.
#
#     outer proxy ──► :8080 (this) ──► api        capped tier
#                                  └─► api-batch  loader tier
#
# One URL for every consumer. The X-API-Key header selects the tier, so a
# project is promoted, demoted or revoked by editing tns-api-keys.map and
# reloading — no consumer changes anything, and nobody outside this stack is
# involved.
#
# Where each knob lives:
#
#   who may call, and their tier   tns-api-keys.map     (reload)
#   requests per minute per tier   this file, below     (reload)
#   query ceilings, pool size      .env, per container  (recreate)


# --- keys ------------------------------------------------------------------
#
# Maps a key to a NAME. The name is what selects the tier, what appears in the
# access log, and what you revoke. The key itself is never logged.
#
# The name CARRIES THE TIER: anything beginning 'batch-' gets the loader tier,
# everything else gets the capped tier. One file to edit, and every log line
# shows which tier served it.
#
# See tns-api-keys.map.example. Create the real one with:
#
#     cp nginx/tns-api-keys.map.example nginx/tns-api-keys.map
#     chmod 600 nginx/tns-api-keys.map
#
# It is gitignored. Issue a key with:  openssl rand -hex 20
map $http_x_api_key $tns_key_name {
    default "";
    include /etc/nginx/tns-api-keys.map;
}

# Name -> which container serves it.
#
# A host:port string rather than an upstream{} block on purpose: names in an
# upstream{} are resolved once at startup, so a container that restarts with a
# new address would be proxied to a stale IP until the gateway was restarted
# too. With a variable and the resolver below, nginx re-resolves through
# Docker's embedded DNS instead.
map $tns_key_name $tns_upstream {
    ~^batch-  api-batch:8000;
    default   api:8000;
}

# Name -> rate limit bucket, capped tier only.
#
# An empty value means the request is not counted at all, which is how the
# loader tier opts out. Note this limits per KEY, not per address: two projects
# behind one NAT get separate budgets, and one project spread over a cluster
# shares a single budget. That is the point of doing it here — the outer proxy
# could only ever limit by address.
map $tns_key_name $tns_limited_id {
    ~^batch-  "";
    default   $tns_key_name;
}

# ── the capped tier's rate. Change here, then: docker compose exec gateway nginx -s reload
limit_req_zone $tns_limited_id     zone=tns_keyed:10m rate=60r/m;

# Backstop by address, covering unknown keys, so a key-guessing sweep cannot
# run flat out. Generous — it should never bind on legitimate traffic.
limit_req_zone $binary_remote_addr zone=tns_edge:10m  rate=600r/m;

# Attribution, the other half of what keys buy: who asked for what, and how
# long it took.  docker compose logs -f gateway
log_format tns_keyed '$remote_addr fwd=$http_x_forwarded_for key=$tns_key_name '
                     '[$time_local] "$request" $status $body_bytes_sent '
                     '${request_time}s';

# Docker's embedded DNS. Required because $tns_upstream is a variable.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    access_log /dev/stdout tns_keyed;

    # Note fwd= in the log format above is informational only. It arrives from
    # the outer proxy, which is outside this stack's control, so it is recorded
    # but never used for a decision. Identity here is the API key.

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_comp_level 5;

    location = /tns-mirror/api {
        return 301 /tns-mirror/api/;
    }

    # OpenAPI, keyless on purpose: it documents a public catalogue, carries no
    # data, and a browser cannot set a header to read it. Longer prefix than
    # the block below, so it wins for /docs and its sub-paths. Delete this
    # location to require a key for it too.
    location /tns-mirror/api/docs {
        limit_req zone=tns_edge burst=60 nodelay;
        # Through a variable, so this resolves per request like the tier
        # routing below rather than being pinned to whatever address the
        # container had when the gateway started.
        set $tns_capped api:8000;
        proxy_pass http://$tns_capped;
        proxy_set_header Host $host;
    }

    # Liveness, keyless, so an uptime check needs no credential. Never touches
    # the database.
    location = /tns-mirror/api/healthz {
        set $tns_capped api:8000;
        proxy_pass http://$tns_capped;
        proxy_set_header Host $host;
        access_log off;
    }

    location /tns-mirror/api/ {
        limit_req zone=tns_edge  burst=60 nodelay;
        limit_req zone=tns_keyed burst=20 nodelay;
        limit_req_status 429;

        # Unknown or absent key. This runs in the rewrite phase, ahead of
        # limit_req, so a rejected request never consumes a rate limit bucket.
        # 'if' containing nothing but a return is the one use of it that is
        # not a trap.
        if ($tns_key_name = "") {
            return 401 '{"status_code":401,"detail":"missing or unknown X-API-Key"}';
        }
        default_type application/json;

        # Variable upstream, so the key picks the tier. With a variable and no
        # URI part, nginx forwards the original request URI untouched — which
        # is what TNS_API_ROOT_PATH=/tns-mirror/api expects on both containers.
        proxy_pass http://$tns_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;

        # The key has done its job. The application has no use for it and no
        # reason to see it.
        proxy_set_header X-API-Key         "";

        # Long enough for a loader-tier bulk pull. The capped tier cannot run
        # anywhere near this; its own query ceilings bound it first.
        proxy_connect_timeout 5s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Otherwise a large body buffers to disk before its first byte reaches
        # the client. Streaming costs nothing here: the handler has already
        # returned its database connection by the time the body is written.
        proxy_buffering off;
    }
}
