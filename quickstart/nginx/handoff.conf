# tns-mirror — the whole reverse-proxy handoff.
#
# Paste this location block into the server{} that already serves this host.
# It is the complete integration; nothing else about tns-mirror needs to be
# known here, and nothing in it changes when consumers, keys or limits change.
#
# Everything behind it — who may call, at what rate, with which ceilings —
# is configured inside the tns-mirror stack on this same host, on port 8080,
# bound to loopback. That gateway is where access is granted and revoked.
#
# Please do NOT:
#
#   * add auth here. The service authenticates its own callers by API key, and
#     a second gate would only mean two places to update to add one consumer.
#   * add a rate limit here. The gateway limits per API key; limiting per
#     address on top would charge every consumer behind one NAT to a single
#     bucket and throttle the wrong people.
#   * rewrite or strip the /tns-mirror/api prefix. The service is mounted on
#     that exact path and builds its OpenAPI URLs from it.

location /tns-mirror/api/ {
    proxy_pass http://127.0.0.1:8080;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $remote_addr;

    # Bulk reads are a supported use of this API and run long by design.
    proxy_connect_timeout 5s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # Responses reach tens of MB. Buffering them to disk first adds latency
    # and disk churn for no benefit.
    proxy_buffering off;
}

# Optional, if you run uptime checks. Needs no key and never touches the
# database, so it is safe to poll as often as you like.
#
#     location = /tns-mirror/api/healthz {
#         proxy_pass http://127.0.0.1:8080;
#         proxy_set_header Host $host;
#         access_log off;
#     }
