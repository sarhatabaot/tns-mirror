# tns-mirror — the smallest thing that works, using a guest tns_marker.
#
# Put the values in a .env beside this file, or edit the defaults inline —
# both work, and .env wins:
#
#   docker compose -f docker-compose.minimal.yml up -d
#
# Apart from the optional bot settings, every line is either required or the
# default; docker-compose.yml is the same thing with the settings you may want
# to change made visible and explained.
#
# Set TNS_USER_AGENT to a marker with your full name, which needs no TNS account:
#
#   TNS_USER_AGENT=tns_marker{"tns_id":0,"type":"guest","name":"YOUR_FULL_NAME"}
#
# Bot credentials also work. They come from Bot Management in your TNS profile
# (https://www.wis-tns.org/), and the server refuses unless all three are set.

name: tns-mirror

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tnsdb}
      POSTGRES_USER: ${POSTGRES_USER:-tns_writer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE-ME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not decoration: the server does not retry a database that is not up yet,
    # so `depends_on` below needs something to wait for.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tns_writer} -d ${POSTGRES_DB:-tnsdb}"]
      interval: 5s
      retries: 20

  server:
    image: sarhatabaot/tns-mirror-server:1.0.5
    depends_on:
      db:
        condition: service_healthy
    environment:
      TNS_AUTH_MODE: ${TNS_AUTH_MODE:-marker}
      TNS_USER_AGENT: ${TNS_USER_AGENT:-}
      # Optional: to use a bot instead, set TNS_AUTH_MODE to "bot" and all three
      # of these.
      TNS_API_KEY: ${TNS_API_KEY:-}
      TNS_BOT_ID: ${TNS_BOT_ID:-}
      TNS_BOT_NAME: ${TNS_BOT_NAME:-}

      # Discrete variables rather than a URL: a generated password often
      # contains '/' or '@', and both change how a URL parses.
      PGHOST: db
      PGUSER: ${PGUSER:-${POSTGRES_USER:-tns_writer}}
      PGPASSWORD: ${PGPASSWORD:-${POSTGRES_PASSWORD:-CHANGE-ME}}
      PGDATABASE: ${PGDATABASE:-${POSTGRES_DB:-tnsdb}}
    volumes:
      - workdir:/var/lib/tns-mirror

volumes:
  pgdata:
  workdir:
