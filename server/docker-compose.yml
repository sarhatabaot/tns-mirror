# "I just want a TNS mirror": docker compose up.
#
# Brings up Postgres and the sync server. The server waits for a healthy
# database, applies migrations, takes an initial full snapshot if the catalogue
# is empty, then follows the schedule.
#
# Copy .env.example to .env and put your own TNS credential in it first — the
# image ships with none, and the server refuses to download anonymously.

name: tns-mirror

services:
  db:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tnsdb}
      POSTGRES_USER: ${POSTGRES_USER:-tns_writer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host by default: the mirror's database is not an
    # internet-facing service (invariant 5). Uncomment to reach it locally.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tns_writer} -d ${POSTGRES_DB:-tnsdb}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: tns-mirror-server:${TNS_MIRROR_VERSION:-1.0.0}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tns_writer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tnsdb}
      # Operator-supplied TNS credential. See .env.example.
      TNS_AUTH_MODE: ${TNS_AUTH_MODE:-marker}
      TNS_USER_AGENT: ${TNS_USER_AGENT:-}
      TNS_API_KEY: ${TNS_API_KEY:-}
      TNS_BOT_ID: ${TNS_BOT_ID:-}
      TNS_BOT_NAME: ${TNS_BOT_NAME:-}
      TNS_THROTTLE: ${TNS_THROTTLE:-10}
    volumes:
      - workdir:/var/lib/tns-mirror
      # Optional YAML config, mounted read-only.
      # - ./config/tns-mirror.yaml:/etc/tns-mirror/tns-mirror.yaml:ro
    # command: ["serve"]  # the image default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pgdata:
  workdir:
