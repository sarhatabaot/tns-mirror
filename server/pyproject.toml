[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tns-mirror-server"
version = "1.0.0"
description = "Mirror the IAU Transient Name Server public objects catalogue into SQL."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "tns-mirror contributors" }]
keywords = ["astronomy", "tns", "transients", "catalogue", "mirror"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
  # The server ships as a Docker image, never to PyPI. This classifier is not
  # documentation: PyPI *rejects* any upload carrying it, so an accidental
  # `twine upload` here fails instead of publishing a sync daemon as a library.
  # Only tns-mirror-client is a PyPI package.
  "Private :: Do Not Upload",
]

# Deliberately small: a downloader, a Postgres driver, a config parser. No web
# framework and no ORM — this is a headless sync job, and every dependency is
# attack surface in a published image (design §8).
dependencies = [
  "requests>=2.32.3",
  "psycopg[binary]>=3.3.4",
  "PyYAML>=6.0.2",
]

[project.scripts]
tns-mirror-server = "tns_mirror_server.cli:main"

[project.urls]
Homepage = "https://github.com/sarhatabaot/tns-mirror"
Changelog = "https://github.com/sarhatabaot/tns-mirror/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
# The migration SQL lives inside the package directory, so it is picked up here
# too: the image needs no files from outside the installed package.
packages = ["src/tns_mirror_server"]

[tool.ruff]
line-length = 96
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
  # 'type' shadows a builtin, but it is a schema column name and the record must
  # use the contract's vocabulary (design §4.1).
  "A003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on internals and use asserts by definition.
"tests/*" = ["S101", "S105", "S106", "SLF001"]
# Realistic TNS fixture rows; wrapping them would stop them being realistic.
"tests/conftest.py" = ["S101", "E501"]
# S608: these build SQL from a schema name the test itself generated, in order
# to inspect the database from outside the store. No external input is involved.
"tests/test_store_postgres.py" = ["S101", "S105", "S106", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: needs a live Postgres (TNS_TEST_DSN); skipped otherwise",
]
filterwarnings = ["error"]
